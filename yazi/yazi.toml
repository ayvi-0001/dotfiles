# https://yazi-rs.github.io/docs/configuration/yazi
# "$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[mgr]
ratio          = [1, 3, 4]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 10
mouse_events   = ["click", "scroll"]

[preview]
wrap            = "no"
tab_size        = 4
max_width       = 1200
max_height      = 1500
cache_dir       = "~/.cache/yazi"
image_delay     = 0
image_filter    = "lanczos3"
image_quality   = 90
ueberzug_scale  = 2
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = "hx %s", desc = "helix", block = true },
  { run = "code %s", desc = "vscode", orphan = true },
  { run = "code -w %s", block = true, desc = "vscode (block)" },
]
open = [
  { run = 'start "" %s1', desc = "open", for = "windows", orphan = true },
  { run = "code %s", block = true, desc = "vscode", orphan = true },
  { run = "7zFM %s", orphan = true, desc = "7zFM" },
  { run = "mpv --force-window %s", orphan = true, desc = "mpv (directory)" },
]
reveal = [
  { run = "explorer /select,%s1", desc = "reveal", for = "windows", orphan = true },
  { run = '''bash -c "clear; exiftool '%s1'; echo Press enter to exit; read _"''', block = true, desc = "show exif", for = "windows" },
]
extract = [
  { run = "ya pub extract --list %s", desc = "ya pub extract" },
  { run = "7zFM %s", orphan = true, desc = "7zFM" },
]
play = [
  { run = "mpv --force-window %s", orphan = true, desc = "mpv" },
  { run = "mpv --fullscreen %s", block = true, desc = "mpv fs" },
  { run = "photoqt %s", orphan = true, desc = "photoqt" },
]
database = [
  { run = '''bash -c "harlequin '%s'"''', block = true, desc = "harlequin", for = "windows" },
]
browser = [
  { run = '''bash -c "\"$BROWSER\" \"$(realpath '%s')\""''', orphan = true, desc = "browser", for = "windows" },
]

[open]
prepend_rules = [
  { url = "*/", use = ["open", "reveal"] }, # Remove edit use from default config on directories.
  { url = "*.{zip,osz*,osk}", use = ["open", "extract"] },
  { mime = "application/sqlite3", use = ["database"] }, # Database opener using harlequin.
  { url = "*.url", use = ["browser", "edit"] }, # Browser opener.
  { url = "*.html", use = ["edit", "browser"] },
  { mime = "image/svg+xml", use = ["browser", "edit"] },
  { mime = "image/*", use = ["play", "open", "reveal"] },
]

[tasks]
image_alloc      = 0 # unlimited
image_bound      = [0, 0] # unlimited
suppress_preload = true

[plugin]
prepend_previewers = [
  { url = "*.md", run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"' },
  { mime = "audio/*", run = "exifaudio" },
]
append_previewers = [
  { mime = "application/*", run = 'piper -- exiftool "$1"' },
]
prepend_fetchers = [
  { url = "*", run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

[input]
cursor_blink  = true
create_origin = "hovered"
rename_origin = "hovered"
filter_origin = "hovered"
find_origin   = "hovered"
search_origin = "hovered"

[confirm]
trash_origin  = "hovered"
trash_offset  = [0, 1, 80, 10]
delete_origin = "hovered"
delete_offset = [0, 1, 80, 10]
